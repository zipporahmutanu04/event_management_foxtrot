{% extends '../base.html' %}

{% block content %}
  <div class="form-wrapper">
    <div class="booking-card">
      <h2>📅 Book Space: {{ space.name }}</h2>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">✅ Submit Booking</button>
      </form>
    </div>
  </div>

  <style>
    .form-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      background-color: #f4f6f8;
      padding: 2rem;
    }

    .booking-card {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      padding: 2rem 2.5rem;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .booking-card h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.8rem;
      color: #333;
    }

    form p {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #007bff;
      outline: none;
    }

    button {
      display: block;
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px 0;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
{% endblock %}
