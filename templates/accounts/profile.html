{% extends '../base.html' %}
{% block content %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card text-center shadow">
        <div class="card-body">
          <h3 class="card-title text-primary">Welcome, {{ user.username }}</h3>
          <p class="card-text">Your email: {{ user.email }}</p>
          <a href="{% url 'logout' %}" class="btn btn-danger mt-3">Logout</a>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
